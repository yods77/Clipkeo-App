name: clipkeo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.4
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  remixicon: ^1.4.1
  syncfusion_flutter_gauges: ^32.1.24
  fl_chart: ^1.1.1
  google_fonts: ^8.0.0
  percent_indicator: ^4.2.5
  glassmorphism: ^3.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.1.1
  flutter_svg: ^2.2.3
  animate_do: ^4.2.0
  flutter_screenutil: ^5.9.3
  badges: ^3.1.2
  solar_icons: ^0.0.5
  provider: ^6.1.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  video_player: ^2.8.1
  font_awesome_flutter: ^10.12.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  google_sign_in: 6.2.1
  youtube_player_flutter: ^9.1.1
  animations: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Perbaikan 1: Di sini CUMA deklarasi versi plugin saja
  flutter_launcher_icons: ^0.13.1
  rename: ^3.0.0
  flutter_lints: ^6.0.0

# Bagian ini konfigurasi Flutter (Aset & Font)
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo_full.png
    - assets/images/money_bag.png
    - assets/icons/tiktok.png
    - assets/icons/instagram.png
    - assets/icons/youtube.png
    - assets/videos/splash_video.mp4
    - assets/banks/

  # Perbaikan 2: 'fonts' harus menjorok 2 spasi (masuk ke dalam flutter)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Perbaikan 3: Settingan Icon dipindah ke PALING BAWAH (Sejajar tembok kiri)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_app.png"
  min_sdk_android: 21
  # Tambahan: Warna Background biar HP baru gak item doang
  adaptive_icon_background: "#ffffff" 
  adaptive_icon_foreground: "assets/icon/logo_app.png"
